<style>
  :root {
    --bg: #ece5dd;
    --panel: #f7f5f1;
    --card: #ffffff;
    --card-own: #d9fdd3;
    --text: #111b21;
    --muted: #667781;
    --border: #e3e0d8;
    --accent: #1f7a5c;
    --shadow: 0 1px 1px rgba(11, 20, 26, .13);
  }
  html[data-theme="dark"] {
    --bg: #0b141a;
    --panel: #111b21;
    --card: #202c33;
    --card-own: #005c4b;
    --text: #e9edef;
    --muted: #8696a0;
    --border: #253138;
    --accent: #4ade80;
    --shadow: 0 1px 1px rgba(0, 0, 0, .4);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Heebo", "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    font-feature-settings: "kern";
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px max(16px, env(safe-area-inset-left)) 10px;
    backdrop-filter: blur(8px);
  }
  .bar { display: flex; align-items: center; gap: 12px; max-width: 880px; margin: 0 auto; }
  .avatar {
    width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center;
    background: linear-gradient(140deg, #2a9d8f, #1f7a5c);
    color: #fff; font-weight: 600; font-size: 20px; flex: 0 0 auto;
  }
  .who { flex: 1; min-width: 0; }
  .who h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.2px; }
  .who p { margin: 1px 0 0; font-size: 12.5px; color: var(--muted); }
  .tools { display: flex; gap: 8px; align-items: center; }
  button.icon {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    width: 38px; height: 38px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: grid; place-items: center;
    transition: transform .12s ease, background .2s ease;
  }
  button.icon:hover { transform: translateY(-1px); }
  .searchwrap { max-width: 880px; margin: 10px auto 0; }
  input[type="search"] {
    width: 100%;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font: inherit;
    font-size: 14px;
    outline: none;
  }
  input[type="search"]:focus { border-color: var(--accent); }
  main { max-width: 880px; margin: 0 auto; padding: 18px 14px 72px; }
  .day { display: flex; justify-content: center; margin: 18px 0 12px; }
  .day span {
    background: var(--card);
    color: var(--muted);
    border: 1px solid var(--border);
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 999px;
    box-shadow: var(--shadow);
  }
  .row { display: flex; margin-bottom: 6px; }
  .row.me { justify-content: flex-start; }
  .row.them { justify-content: flex-end; }
  .bubble {
    max-width: min(78%, 620px);
    background: var(--card);
    border-radius: 12px;
    padding: 8px 11px 6px;
    box-shadow: var(--shadow);
    white-space: pre-wrap;
    word-break: break-word;
    position: relative;
  }
  .row.me .bubble { background: var(--card-own); border-top-left-radius: 4px; }
  .row.them .bubble { border-top-right-radius: 4px; }
  .meta {
    display: flex; gap: 8px; align-items: baseline;
    font-size: 11px; color: var(--muted);
    margin-bottom: 1px;
  }
  .row.me .meta { justify-content: flex-end; }
  .name { font-weight: 600; color: var(--accent); }
  html[data-theme="dark"] .row.me .name { color: #7ee2b8; }
  .txt { font-size: 15px; }
  .txt mark { background: #ffe58a; color: #111; border-radius: 3px; padding: 0 2px; }
  html[data-theme="dark"] .txt mark { background: #73601a; color: #fff; }
  .att { font-size: 13px; margin-top: 4px; }
  .att a { color: var(--accent); }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  footer {
    position: fixed; inset: auto 0 0 0;
    background: var(--panel); border-top: 1px solid var(--border);
    text-align: center; font-size: 12px; color: var(--muted);
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  }
  .stats { max-width: 880px; margin: 0 auto; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<header>

      <p class="stats">10 באוגוסט 2025 – 11 באוגוסט 2025 · 55 הודעות</p>
    </div>
    <div class="tools">
      <button class="icon" id="themeBtn" type="button" title="מצב כהה / בהיר" aria-label="מצב כהה / בהיר">🌙</button>
        </div>
  </div>
  <div class="searchwrap">
    <input id="search" type="search" placeholder="חיפוש בהודעות…" autocomplete="off" />
  </div>
</header>
<main id="chat"></main>
<footer>ייצוא היסטוריית שיחת Google Chat · אלי גרינבאום ↔ שמעון</footer>

const chat = document.getElementById('chat');
const search = document.getElementById('search');
const dateFmt = new Intl.DateTimeFormat('he-IL', { day: 'numeric', month: 'long', year: 'numeric' });
const timeFmt = new Intl.DateTimeFormat('he-IL', { hour: '2-digit', minute: '2-digit', hour12: false });

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function highlight(text, q) {
  const safe = esc(text);
  if (!q) return safe;
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if (idx < 0) return safe;
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return esc(text).replace(re, '<mark>$1</mark>');
}

function render(q) {
  const ql = (q || '').trim();
  const rows = ql ? DATA.filter((m) => m.x.toLowerCase().includes(ql.toLowerCase())) : DATA;
  if (!rows.length) {
    chat.innerHTML = '<p class="empty">לא נמצאו הודעות תואמות</p>';
    return;
  }
  let html = '';
  let day = '';
  for (const m of rows) {
    const d = dateFmt.format(new Date(m.t));
    if (d !== day) {
      day = d;
      html += '<div class="day"><span>' + esc(d) + '</span></div>';
    }
    html += '<div class="row ' + (m.s ? 'me' : 'them') + '">' +
      '<div class="bubble">' +
        '<div class="meta"><span class="name">' + esc(m.s ? OWNER : PEER) + '</span><span>' + timeFmt.format(new Date(m.t)) + '</span></div>' +
        '<div class="txt">' + highlight(m.x, ql) + '</div>' +
        (m.a && m.a.length ? '<div class="att">' + m.a.map((a) => '<a href="' + esc(a.url) + '" target="_blank" rel="noopener noreferrer">📎 ' + esc(a.name || 'קובץ') + '</a>').join(' ') + '</div>' : '') +
      '</div></div>';
  }
  chat.innerHTML = html;
}

search.addEventListener('input', (e) => render(e.target.value));

const themeBtn = document.getElementById('themeBtn');
const root = document.documentElement;
const store = {
  get() { try { return localStorage.getItem('chat-theme'); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem('chat-theme', v); } catch (e) {} },
};
const saved = store.get();
if (saved) root.dataset.theme = saved;
themeBtn.textContent = root.dataset.theme === 'dark' ? '☀️' : '🌙';
themeBtn.addEventListener('click', () => {
  const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
  root.dataset.theme = next;
  store.set(next);
  themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
});

render('');
</script>
