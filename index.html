ותי בריאות, ארגוני הגנה ומוסדות לאומיים. הייתה שאיפה ברורה להקמת מדינה יהודית.\n\nהייתה גם אוכלוסייה ערבית גדולה, עם ערים, כפרים, מוסדות ומנהיגות פוליטית משלה, ובקרב ההנהגה הערבית הייתה התנגדות להקמת מדינה יהודית.\n\nלכן הארץ לא הייתה \"מדינה ערבית\" לפני 1948, וגם לא \"מדינה יהודית\". היא הייתה ארץ תחת שלטון בריטי שבה חיו שני עמים/קהילות לאומיות מרכזיות.\n\n\nב־14 במאי 1948 הוכרזה מדינת ישראל, ובמקביל פרצה המלחמה שהפכה את שאלת המדינה והגבולות למשהו הרבה יותר מורכב.","a":[],"r":[]},{"s":1,"t":"2026-10-02T13:07:12.036367Z","x":"מצוין","a":[],"r":[]},{"s":1,"t":"2026-10-02T13:07:17.600175Z","x":"זה חלק אחד","a":[],"r":[]},{"s":1,"t":"2026-10-02T13:07:22.605599Z","x":"וחלק שני זה גם יעילות","a":[],"r":[]},{"s":1,"t":"2026-10-02T13:07:32.237087Z","x":"מה הכי יעיל עבורנו?","a":[],"r":[]},{"s":1,"t":"2026-10-02T13:07:38.131151Z","x":"להמשיך לרצוח אחד את השני?","a":[],"r":[]},{"s":1,"t":"2026-10-02T13:07:43.680335Z","x":"או למצוא פתרון?","a":[],"r":[]},{"s":0,"t":"2026-10-02T13:08:01.635791Z","x":"אבל נראה לך שיש אפשרות של שתי מדינות לשתי עמים","a":[],"r":[]},{"s":1,"t":"2026-10-02T13:08:07.443471Z","x":"כן","a":[],"r":[]},{"s":1,"t":"2026-10-02T13:08:14.269791Z","x":"נראה לך שלא?","a":[],"r":[]},{"s":0,"t":"2026-10-02T13:08:19.190655Z","x":"הרי ערבים אומרים מנער עד הנער המדינה שלנו","a":[],"r":[]},{"s":1,"t":"2026-10-02T13:08:24.930735Z","x":"ממש לא כולם","a":[],"r":[]},{"s":0,"t":"2026-10-02T13:08:28.208559Z","x":"הם רוצים את כל השטח","a":[],"r":[]},{"s":1,"t":"2026-10-02T13:08:31.243967Z","x":"יש כאלה גם אצלנו","a":[],"r":[]},{"s":1,"t":"2026-10-02T13:08:33.713487Z","x":"באותה מידה","a":[],"r":[]},{"s":0,"t":"2026-10-02T13:08:39.175295Z","x":"נכון","a":[],"r":[]},{"s":0,"t":"2026-10-02T13:08:50.207311Z","x":"אז איך נראה לך  נוכל להקים כזה מדינה","a":[],"r":[]},{"s":1,"t":"2026-10-02T13:08:50.405215Z","x":"ואנחנו עדיין לא רוצחים אותם מהנהר ועד הים","a":[],"r":[]},{"s":1,"t":"2026-10-02T13:08:59.300959Z","x":"כי בסוף הנורמליים שולטים","a":[],"r":[]},{"s":0,"t":"2026-10-02 התנגדו, קבוצה של ישראלים תועדה היום (שבת) באירוע הקפות במסגרת שמחת תורה במתחם הנובה. באחד התיעודים, ניתן לראות את מיצג הכלניות שהוא חלק ממתחם הזיכרון, וממש כמה מטרים ממנו מתקיימות ההקפות.\nבסרטון נשמע המצלם תוהה: \"אבל סיכמנו שזה לא יתקיים פה\". מי שקרא את המסרים מהמארגנים בימים האחרונים איננו מופתע. ביום חמישי הם פרסמו הודעה שבה הם מבהירים שאירוע ההקפות לא בוטל, וזאת למרות הודעות המשטרה וקק\"ל. בהודעה הם מציינים שהאירוע מתקיים בתמיכה של משפחות שכולות, אך כאמור, היא סותרת את הוראת הגורמים המוסמכים.\nהמלצות נוספות\nתוסיפו את זה לקפה של הבוקר. אחרי 3 ימים הג'ינס כבר צריך חגורהממומן | Smart Wellness Report\nשעות אחרונות: עד 60 מיליון ש״ח בלוטו! כך תמלאו טופס אונליין תוך 2 דקותממומן | Channel22\nמדען ישראלי מבקש: ״רוצו להיבדק. זה יכול להציל לכם את החיים״ממומן | News!\n\"זו הטרדה מינית לכל דבר\": הכוכבת רקדה בעירום מול עובד בביתה\nבהודעה שפרסמו המארגנים ביום חמישי, הם קראו לציבור \"לכבד את האופנים השונים שבהן בוחרות משפחות שונות לציין את היום בו עלו יקירהן בסערה השמימה\". קק\"ל, שהשטח נמצא תחת ניהולה, הבהירה כמה ימים לפני כן: \"קק\"ל מבהירה כי מתחם הנובה ביער רעים הוא אתר זיכרון והתייחדות, וכי הביקור בו בתקופה זו יתאפשר למטרה זו בלבד. בתיאום עם משטרת ישראל וגורמי הביטחון וההצלה, לא יינתן אישור לקיום אירועים או פעילויות מאורגנות שאינן לצורכי זיכרון והתייחדות\".\nבשנה שעברה, אז ציינו שנתיים לטבח, התקיים אירוע דומה במתחם הנובה שגרר גל תגובות זועמות מצד משפחות שכולות. בעקבותיו, השנה המשטרה וקק\"ל הבהירו שאינן מאשרות את החגיגות, כאמור.\nיורם יהודאי, אב שכול שאיבד את בנו רון בנובה, סיפר שהגיע היום לאתר יחד עם אשתו כדי לוודא שהסדר נשמר וכי הוראות הרשויות מבוצעות. \"באמת לא באתי להתעמת, סמכתי על המשטרה שיאכפו את ההסדרה\", אמר ל-N12. \"הגענו עם צמחים לטפל במיצג של רון שלנו, לשתול צמחים, להשקות ולבקר במכולה לקראת הטקס ברביעי\".\nפרסומת\nהוא הוסיף: \"שמעתי ברקע קולות וצהלולים, סיימתי עם המיצג ובמתחם הנובה על הכלניות חבורה גדולה מאוד מרקדים וצוהלים, שתויים כולם. ניגשתי, שאלתי אם יש הורים שכולים ביניהם, אח, אחות. שום דבר. לא היו. רק פרחחים\".\nמשפחות שכולות נוספות, שחששו שהאירוע אכן Z","x":"שניצל","a":[],"r":[]},{"s":0,"t":"2026-10-11T00:17:19.780687Z","x":"חחח","a":[],"r":[]},{"s":0,"t":"2026-10-11T00:17:21.423855Z","x":"כן","a":[],"r":[]},{"s":0,"t":"2026-10-11T00:17:26.029726Z","x":"מה קשר","a":[],"r":[]},{"s":1,"t":"2026-10-11T00:18:32.466447Z","x":"אין קשר","a":[],"r":[]},{"s":1,"t":"2026-10-11T00:18:33.558143Z","x":"חחח","a":[],"r":[]},{"s":1,"t":"2026-10-11T00:18:40.109983Z","x":"אני חייב שוקו בננה","a":[],"r":[]},{"s":0,"t":"2026-10-11T00:18:53.765663Z","x":"איך מכינים","a":[],"r":[]},{"s":1,"t":"2026-10-11T00:19:41.485407Z","x":"הכנת שוקו בננה (Banana Chocolate Smoothie) בבית היא פשוטה, מהירה ומשדרגת כל בוקר או אחר הצהריים! המפתח למרקם קטיפתי ועשיר (Creamy Texture) הוא שימוש בבננה קפואה.\n\n📋 רכיבים (למנה אחת גדולה)\nבננה: 1 בננה בשלה (מומלץ לקלף, לחתוך לפרוסות ולהקפיא מראש למשך כשעתיים).\n\nחלב: 1 כוס (חלב בקר, או תחליף צמחי כמו חלב שקדים/שיבולת שועל).\n\nקקאו / שוקולית: 1 כף גדושה של אבקת קקאו איכותית (או שוקולית לגרסה מתוקה יותר).\n\nממתיק (אופציונלי): 1 כפית דבש, סילאן או מייפל (אם הבננה מספיק מתוקה, אין בהכרח צורך).\n\nתוספות שדרוג (אופציונלי): 1 כף חמאת בוטנים, קורט קינמון, או מעט תמצית וניל.\n\n🥣 הוראות הכנה\nהכנסת המרכיבים: מכניסים לתוך בלנדר (Blender) את הבננה הקפואה, החלב ואבקת הקקאו/השוקולית.\n\nהמתקה ושדרוגים: מוסיפים את הממתיק או חמאת הבוטנים לפי הטעם.\n\nערבול: טוחנים במהירות גבוהה במשך 30–60 שניות, עד לקבלת מרקם חלק, אחיד וסמיך.\n\nהגשה: מוזגים לכוס גבוהה. מומלץ לקשט מלמעלה במעט אבקת קקאו, שבבי שוקולד או פרוסת בננה.\n\n💡 Extra Tips לקבלת משקה מושלם\nסמיכות המשקה: אם המשקה סמיך מדי לטעמך, אפשר להוסיף עוד מעט חלב ולערבל שוב. אם הוא דליל מדי, הוסיף עוד כמה קוביות קרח או עוד פרוסות בננה קפואה.\n\nחלבון נוסף: ספורטאים? אפשר להוסיף סקופ של אבקת חלבון בטעם וניל או שוקולד לקבלת שייק חלבון מעולה לאחר אימון (Post-workout drink).","a":[],"r":[]},{"s":0,"t":"2026-10-11T00:21:54.851903Z","x":"🥤 לאלי היקר!\nשייק שוקו-בננה מפנק, עשיר וקטיפתי – משהו מתוק וטעים במיוחד בשבילך!\nמוגש באהבה רבה! ❤️","a":[{"n":"1000032966.jpeg","t":"image/jp וג האנשים שקונים מחברת כדי להתחיל חיים חדשים, כותבים בעמוד הראשון \"מטרות לשנת 2027\", ובעמוד השני כבר יש כתם של קפה ושלושה מספרי טלפון שאתה לא זוכר של מי הם.\nאתה קם בבוקר עם מוטיבציה של טוני רובינס, ובשעה 10:30 כבר שוכב במיטה וצופה בסרטונים על אנשים שקמים בחמש בבוקר.\nאחי, אתה לא דחיין, אתה משמר את המשימות שלך לדורות הבאים. 😂\nבוא נדבר על הכושר שלך.\nאתה משלם מנוי לחדר כושר כבר שמונה חודשים, והשריר היחיד שהתחזק אצלך הוא השריר שמרים את הטלפון כדי לבדוק אם ירד החיוב החודשי.\nהמאמן שלך כבר לא שואל מתי אתה מגיע. הוא שולח לך הודעה פעם בחודש: \"הכול בסדר איתך?\"\nאתה קונה אבקת חלבון בטעם שוקולד, שייקר, כפפות, חגורה, נעלי אימון ובקבוק של שני ליטר — כאילו אתה מתכונן לאולימפיאדה, ובסוף עולה במדרגות ומתנשף כמו טרקטור בלי שמן.\nכוס אמק, אפילו השעון החכם שלך הפסיק לספור צעדים כי הוא הבין שאין למה לצפות.\nוהאוכל שלך?\nאתה אומר שאתה מתחיל תזונה בריאה ביום ראשון. ביום ראשון אתה אוכל סלט. ביום שני אתה אוכל פיצה כי \"צריך גם ליהנות מהחיים\". ביום שלישי אתה מזמין המבורגר כי כבר הרסת את הרצף.\nאחי, הרצף שלך כל כך קצר שאפילו פרסומת ביוטיוב מחזיקה יותר זמן.\nועכשיו לכסף.\nאתה מסוגל לחסוך 200 שקל במשך חודשיים, ואז להוציא 800 שקל על משהו שראית בטיקטוק בשעה 2 בלילה.\nיש לך מגירה מלאה במוצרים שקנית כי הם \"ישנו לך את החיים\":\nאוזניות אלחוטיות שכבר לא נטענות.\nשעון חכם שאתה לא יודע להפעיל.\nמכונת קפה שהפכה למתקן אחסון.\nגאדג'ט סיני שאפילו המוכר באליאקספרס לא יודע מה הוא עושה.\nאתה לא צרכן, אתה אתר פסולת של החלטות אימפולסיביות.\nוהכי גרוע? אתה עוד אומר \"יצא לי ממש משתלם\".\nמשתלם למי יא בן זונה? לסינים?!\nבחיי, אם היו נותנים לך לנהל מדינה, תוך שבוע היית מוכר את משרד האוצר בשביל קופון של 15 אחוז.\nובוא נדבר על חיי החברה שלך.\nאתה רואה הודעה בוואטסאפ, נכנס אליה, קורא, חושב על תשובה, יוצא, חוזר אחרי שלוש שעות, ואז כותב \"חחחח\".\nאחי, הבן אדם שאל אותך אם אתה מגיע לחתונה, לא ביקש ממך לנסח הסכם שלום בין רוסיה לאוקראינה.\nאתה גם מסוגל לספר סיפור של חמש דקות שמתחיל ב\"אתה לא מבין מה קרה לי היום\" ומסתיים בזה שהשכן שלך קנה מקרר.\nואיכשהו, באמצע, אתה שוכח מה רצית להגיד.\nיא חביבי, אפילו הזיכרון של const chat = document.getElementById('chat');
const search = document.getElementById('search');
const dateFmt = new Intl.DateTimeFormat('he-IL', { day: 'numeric', month: 'long', year: 'numeric' });
const timeFmt = new Intl.DateTimeFormat('he-IL', { hour: '2-digit', minute: '2-digit', hour12: false });

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function highlight(text, q) {
  const safe = esc(text);
  if (!q) return safe;
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if (idx < 0) return safe;
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return esc(text).replace(re, '<mark>$1</mark>');
}

const CHUNK = 200;
let rows = DATA;
let start = 0; // first message of the visible window
let end = 0; // one past the last message of the visible window
let query = ''; // active search, used for highlighting
const counter = document.getElementById('counter');
const navStart = document.getElementById('navStart');
const navOlder = document.getElementById('navOlder');
const navNewer = document.getElementById('navNewer');
const navEnd = document.getElementById('navEnd');

function dayOf(t) { return dateFmt.format(new Date(t)); }
function dayHTML(d) { return '<div class="day"><span>' + esc(d) + '</span></div>'; }

function mediaHTML(a) {
  const name = esc(a.n || 'קובץ');
  if (!a.f) return '<span class="chip" title="הקובץ לא היה זמין להורדה">📎 ' + name + '</span>';
  const src = esc(a.f);
  const type = a.t || '';
  if (type.indexOf('image/') === 0) {
    return '<a class="shot" href="' + src + '" target="_blank" rel="noopener" title="' + name + '">' +
      '<img src="' + src + '" alt="' + name + '" loading="lazy" decoding="async" /></a>';
  }
  if (type.indexOf('video/') === 0) return '<video class="vid" controls preload="none" src="' + src + '"></video>';
  if (type.indexOf('audio/') === 0) return '<audio class="aud" controls preload="none" src="' + src + '"></audio>';
  return '<a class="chip" href="' + src + '" target="_blank" rel="noopener">📎 ' + name + '</a>';
}

function rowHTML(m) {
  const atts = m.a && m.a.length ? '<div class="att">' + m.a.map(mediaHTML).join('') + '</div>' : '';
  const rx = m.r && m.r.length
    ? '<div class="rx">' +
      m.r.map((r) => '<span class="rxchip">' + esc(r.e) + (r.c > 1 ? ' ' + r.c : '') + '</span>').join('') +
      '</div>'
    : '';
  return '<div class="row ' + (m.s ? 'me' : 'them') + '">' +
    '<div class="bubble">' +
      '<div class="meta"><span class="name">' + esc(m.s ? OWNER : PEER) + '</span><span>' + timeFmt.format(new Date(m.t)) + '</span></div>' +
      (m.x ? '<div class="txt">' + highlight(m.x, query) + '</div>' : '') +
      atts + rx +
    '</div></div>';
}

// Builds the markup for rows[from..to), comparing with the message just before
// the window so a day divider is not repeated when paging in either direction.
function buildChunk(from, to) {
  let html = '';
  let prevDay = from > 0 ? dayOf(rows[from - 1].t) : null;
  for (let i = from; i < to; i++) {
    const m = rows[i];
    const d = dayOf(m.t);
    if (d !== prevDay) { html += dayHTML(d); prevDay = d; }
    html += rowHTML(m);
  }
  return html;
}

function update() {
  const total = rows.length;
  counter.textContent = total
    ? (start + 1).toLocaleString('he-IL') + '–' + end.toLocaleString('he-IL') + ' מתוך ' + total.toLocaleString('he-IL') + ' הודעות'
    : 'אין תוצאות';
  navStart.disabled = navOlder.disabled = start <= 0;
  navEnd.disabled = navNewer.disabled = !total || end >= total;
}

function paint() {
  chat.innerHTML = rows.length ? buildChunk(start, end) : '<p class="empty">לא נמצאו הודעות תואמות</p>';
  update();
}

function prependOlder() {
  if (start <= 0) return;
  const from = Math.max(0, start - CHUNK);
  const h = document.documentElement.scrollHeight;
  chat.insertAdjacentHTML('afterbegin', buildChunk(from, start));
  window.scrollBy(0, document.documentElement.scrollHeight - h);
  start = from;
  update();
}

function appendNewer() {
  if (end >= rows.length) return;
  const to = Math.min(rows.length, end + CHUNK);
  chat.insertAdjacentHTML('beforeend', buildChunk(end, to));
  end = to;
  update();
}

function goStart() {
  query = (search.value || '').trim();
  start = 0;
  end = Math.min(rows.length, CHUNK);
  paint();
  window.scrollTo({ top: 0 });
}

function goEnd() {
  end = rows.length;
  start = Math.max(0, end - CHUNK);
  paint();
  window.scrollTo({ top: document.documentElement.scrollHeight });
}

let debounce;
search.addEventListener('input', (e) => {
  clearTimeout(debounce);
  const value = e.target.value;
  debounce = setTimeout(() => {
    query = value.trim();
    const lower = query.toLowerCase();
    rows = lower ? DATA.filter((m) => m.x.toLowerCase().includes(lower)) : DATA;
    start = 0;
    end = Math.min(rows.length, CHUNK);
    paint();
    window.scrollTo({ top: 0 });
  }, 140);
});

navStart.addEventListener('click', goStart);
navEnd.addEventListener('click', goEnd);
navOlder.addEventListener('click', prependOlder);
navNewer.addEventListener('click', appendNewer);

// Auto-paging in both directions while scrolling through the history.
let ticking = false;
window.addEventListener('scroll', () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    if (start > 0 && window.scrollY < 200) prependOlder();
    else if (end < rows.length && window.innerHeight + window.scrollY > document.documentElement.scrollHeight - 400) appendNewer();
  });
}, { passive: true });

const themeBtn = document.getElementById('themeBtn');
const root = document.documentElement;
const store = {
  get() { try { return localStorage.getItem('chat-theme'); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem('chat-theme', v); } catch (e) {} },
};
const saved = store.get();
if (saved) root.dataset.theme = saved;
themeBtn.textContent = root.dataset.theme === 'dark' ? '☀️' : '🌙';
themeBtn.addEventListener('click', () => {
  const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
  root.dataset.theme = next;
  store.set(next);
  themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
});

rows = DATA;
end = rows.length;
start = Math.max(0, end - CHUNK);
paint();
window.scrollTo({ top: document.documentElement.scrollHeight });
</script>
</body>
</html>
